name: CI

on:
  push:
    branches:
      - main
      - 'sprint*'
  pull_request:
    branches:
      - main
      - 'sprint*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test

      - name: Run Build
        run: npm run build

      - name: Vocabulary Check
        run: |
          ! git grep -I -E -i "claude|anthropic|gemini|openai|gpt|copilot|co-authored|generated with|generated by|llm|language model" -- ':/' ':!node_modules' ':!package-lock.json' ':!*.md' ':!.gemini/**' ':!.github/workflows/**'
